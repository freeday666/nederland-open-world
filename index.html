<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bouwlust Drive — prototype</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; overflow: hidden; background: #9dc4d4; font: 14px Arial, sans-serif }
    canvas { display: block }
    #hud {
      position: fixed; inset: 16px 16px auto; display: flex; justify-content: space-between;
      color: white; text-shadow: 0 2px 5px #000; pointer-events: none
    }
    .panel { background: #101820bb; padding: 12px 16px; border-radius: 12px }
    #help { position: fixed; left: 16px; bottom: 16px; color: white;
      background: #101820bb; padding: 12px 16px; border-radius: 12px }
    #crosshair { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px;
      background: #ffffff99; border-radius: 50%; transform: translate(-50%,-50%) }
    #maplink { color: #a6e2ff }
  </style>
</head>
<body>
  <div id="hud">
    <div class="panel"><b>BOUWLUST DRIVE</b><br>Den Haag · First-person prototype</div>
    <div class="panel">Snelheid: <span id="speed">0</span> km/u</div>
  </div>
  <div id="crosshair"></div>
  <div id="help">
    <b>Besturing</b> · W / ↑ gas · S / ↓ rem · A D / ← → sturen<br>
    <a id="maplink" target="_blank" rel="noopener"
       href="https://www.google.com/maps/search/?api=1&query=52.0349903,4.2695371">
       Bekijk Bouwlust op Google Maps
    </a>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9dc4d4);
    scene.fog = new THREE.Fog(0x9dc4d4, 45, 220);

    const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 500);
    camera.position.set(0, 1.55, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xe8f5ff, 0x65704d, 2));
    const sun = new THREE.DirectionalLight(0xffedcf, 3);
    sun.position.set(-25, 45, 15);
    sun.castShadow = true;
    scene.add(sun);

    const mat = (color, roughness = 0.9) =>
      new THREE.MeshStandardMaterial({ color, roughness });

    const asphalt = mat(0x343a3e), sidewalk = mat(0xa9a89e);
    const grass = mat(0x71835a), brickA = mat(0xb77b68), brickB = mat(0xc1937d);
    const glass = new THREE.MeshStandardMaterial({
      color: 0x78949b, roughness: 0.28, metalness: 0.15
    });

    // Straat, stoepen en wegmarkeringen.
    const road = new THREE.Mesh(new THREE.PlaneGeometry(12, 500), asphalt);
    road.rotation.x = -Math.PI / 2;
    road.position.set(0, 0, -180);
    road.receiveShadow = true;
    scene.add(road);

    for (const x of [-8.2, 8.2]) {
      const path = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 500), sidewalk);
      path.rotation.x = -Math.PI / 2;
      path.position.set(x, 0.015, -180);
      scene.add(path);

      const lawn = new THREE.Mesh(new THREE.PlaneGeometry(18, 500), grass);
      lawn.rotation.x = -Math.PI / 2;
      lawn.position.set(x * 2.05, 0, -180);
      scene.add(lawn);
    }

    // Onderbroken middenstreep.
    for (let z = 15; z > -430; z -= 12) {
      const stripe = new THREE.Mesh(new THREE.PlaneGeometry(0.13, 5), mat(0xe8e4ce));
      stripe.rotation.x = -Math.PI / 2;
      stripe.position.set(0, 0.025, z);
      scene.add(stripe);
    }

    // Huizenblokken met variatie in gevels, ramen en daken.
    function makeHouse(x, z, side, i) {
      const width = 6.2 + (i % 3) * 0.5;
      const height = 6.4 + (i % 4) * 0.55;
      const depth = 8.5;
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, depth),
        i % 2 ? brickA : brickB
      );
      body.position.set(x, height / 2, z);
      body.castShadow = true;
      body.receiveShadow = true;
      scene.add(body);

      const roof = new THREE.Mesh(
        new THREE.ConeGeometry(width * 0.75, 2.1, 4),
        mat(0x554b47)
      );
      roof.position.set(x, height + 1.05, z);
      roof.rotation.y = Math.PI / 4;
      roof.castShadow = true;
      scene.add(roof);

      // Ramen aan de straatkant.
      for (let floor = 0; floor < 2; floor++) {
        for (let w = -1; w <= 1; w++) {
          const windowMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(1.05, 1.35), glass
          );
          windowMesh.position.set(
            x + w * 1.65,
            2.1 + floor * 2.5,
            z + (side < 0 ? depth / 2 + 0.012 : -depth / 2 - 0.012)
          );
          if (side > 0) windowMesh.rotation.y = Math.PI;
          scene.add(windowMesh);
        }
      }

      const door = new THREE.Mesh(
        new THREE.BoxGeometry(0.9, 2.1, 0.12), mat(0x493c33)
      );
      door.position.set(x, 1.05, z + (side < 0 ? depth / 2 + 0.04 : -depth / 2 - 0.04));
      scene.add(door);
    }

    for (let i = 0; i < 34; i++) {
      const z = 12 - i * 13;
      makeHouse(-12.8, z, -1, i);
      makeHouse(12.8, z - 5, 1, i + 1);
    }

    // Bomen langs de trottoirs.
    for (let i = 0; i < 45; i++) {
      const z = 5 - i * 10;
      for (const x of [-8.1, 8.1]) {
        const trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.16, 0.23, 2.4, 8), mat(0x69513b)
        );
        trunk.position.set(x, 1.2, z);
        trunk.castShadow = true;
        scene.add(trunk);

        const crown = new THREE.Mesh(
          new THREE.SphereGeometry(1.25 + (i % 3) * 0.12, 10, 8),
          mat(i % 2 ? 0x55744b : 0x668252)
        );
        crown.position.set(x, 3.05, z);
        crown.castShadow = true;
        scene.add(crown);
      }
    }

    // Eenvoudige cockpit: dashboard, motorkap en stuur.
    const dark = mat(0x171b1d, 0.45);
    const dash = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.24, 0.75), dark);
    dash.position.set(0, 0.67, -0.72);
    camera.add(dash);

    const hood = new THREE.Mesh(
      new THREE.BoxGeometry(1.35, 0.12, 1.1), mat(0x526d78, 0.35)
    );
    hood.position.set(0, 0.48, -1.25);
    camera.add(hood);

    const wheel = new THREE.Mesh(
      new THREE.TorusGeometry(0.27, 0.045, 8, 24), dark
    );
    wheel.position.set(0, 0.61, -0.48);
    camera.add(wheel);

    scene.add(camera);

    const keys = {};
    addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
    addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

    let speed = 0;
    let carX = 0;
    let heading = 0;
    const speedLabel = document.getElementById("speed");
    const clock = new THREE.Clock();

    function update() {
      requestAnimationFrame(update);
      const dt = Math.min(clock.getDelta(), 0.04);

      const gas = keys.w || keys.arrowup;
      const brake = keys.s || keys.arrowdown;
      const left = keys.a || keys.arrowleft;
      const right = keys.d || keys.arrowright;

      if (gas) speed += 13 * dt;
      else speed -= 3.2 * dt;
      if (brake) speed -= 22 * dt;
      speed = THREE.MathUtils.clamp(speed, 0, 38);

      const steer = (left ? 1 : 0) - (right ? 1 : 0);
      heading += steer * dt * (0.25 + speed * 0.018);
      carX += Math.sin(heading) * speed * dt * 0.34;
      carX = THREE.MathUtils.clamp(carX, -4.3, 4.3);

      camera.position.x = THREE.MathUtils.lerp(camera.position.x, carX, 0.12);
      camera.rotation.y = heading;
      camera.position.z -= speed * dt;

      // Hergebruik de straatomgeving zodat je lang kunt doorrijden.
      if (camera.position.z < -300) {
        camera.position.z += 220;
      }

      speedLabel.textContent = Math.round(speed * 3.6);
      renderer.render(scene, camera);
    }
    update();

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
